# react-app/nginx.conf

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # ── прокси на бэкенд ────────────────────────────────
  # app — имя сервиса из docker-compose, 3000 — порт внутри контейнера

  location /graphql {
    proxy_pass http://app:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /upload/ {
    proxy_pass http://app:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # без этого загрузка скриншота больше 1 МБ упадёт с 413
    client_max_body_size 10m;
  }

  # загруженные картинки раздаёт Nest через ServeStaticModule
  location /public/ {
    proxy_pass http://app:3000;
    proxy_set_header Host $host;
    expires 30d;
    add_header Cache-Control "public";
  }

  # ── статика фронта ──────────────────────────────────

  location ~* \.(js|css|woff2|svg|png|jpg|jpeg|webp|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA-фоллбэк: без него прямой заход на /admin и /review даст 404,
  # потому что таких файлов на диске нет — роутинг клиентский
  location / {
    try_files $uri $uri/ /index.html;
  }
}
