services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-portfolio}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-portfolio}"
      POSTGRES_DB: "${POSTGRES_DB:-portfolio}"
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-portfolio} -d ${POSTGRES_DB:-portfolio}",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  app:
    build: ./nestjs-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD:-portfolio}@db:5432/${POSTGRES_DB:-portfolio}?schema=public"
      PORT: "3000"
      NODE_ENV: "production"
      ADMIN_TOKEN: "${ADMIN_TOKEN}"
    ports:
      - "127.0.0.1:3000:3000" # Открываем порт бэкенда СТРОГО для локального Nginx
    volumes:
      # Мапим загрузки в реальную папку на сервере
      - /var/www/portfolio-uploads:/app/public/uploads 

volumes:
  db-data:
