services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-portfolio}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-portfolio}"
      POSTGRES_DB: "${POSTGRES_DB:-portfolio}"
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolio} -d ${POSTGRES_DB:-portfolio}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  app:
    build: ./nestjs-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD:-portfolio}@db:5432/${POSTGRES_DB:-portfolio}?schema=public"
      PORT: "3000"
      NODE_ENV: "production"
      ADMIN_TOKEN: "${ADMIN_TOKEN}"
    volumes:
      - uploads:/app/public/uploads
    ports:
      - "3000:3000"

  web:
    build:
      context: ./react-app
      args:
        VITE_BACKEND_URL: ""
    environment:
      BACKEND_ORIGIN: "http://app:3000"
    depends_on:
      - app
    ports:
      - "4173:80"

volumes:
  db-data:
  uploads: